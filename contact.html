<main>
<div class="content">
    <h2>Contact Form</h2>
    <p>Please fill out the required fields:</p>

    <form>

        <label>Full Name</label><br>
        <input type="text" name="fullname" required><br><br>

        <label>Email</label><br>
        <input type="email" name="email" required><br><br>

        <label>Phone</label><br>
        <input type="tel" name="phone" required><br><br>

        <label>Reason for Contact</label><br>
        <select name="reason" required>
            <option value="">Select one</option>
            <option value="estimate">Request an Estimate</option>
            <option value="project">Project Question</option>
            <option value="support">Support / Warranty</option>
        </select><br><br>

        <label>Message</label><br>
        <textarea name="message" rows="5" required></textarea><br><br>

        <button type="submit">Send</button>
        <button type="reset">Clear</button>

        

    </form>
</div>
</main>
