<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SWW Non thai provides renovation, construction, roofing, and carpentry services. Contact us for estimates and support.">
    <title>SWW Nonthai - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="banner">
        <img src="images/Logo.png" alt="SWW Nonthai Logo" class="logo">
        <h1>Contact SWW Nonthai</h1>
        <p><strong>Structure We Well - By Thanakorn Sajjapong</strong></p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="project.html">Projects</a>
        <a href="request.html">Request a job</a>
        <a href="contact.html">Contact Us</a>
    </nav>
<main>
<div class="content">
    <h2>Contact Form</h2>
    <p>Please fill out the required fields:</p>

    <form action="" method="post" onsubmit="return validateForm();">

        <label for="firstname">First Name</label><br>
        <input type="text" id="firstname" name="firstname" required><br><br>

        <label for="lastname">Last Name</label><br>
        <input type="text" id="lastname" name="lastname" required><br><br>

        <label for="city">City</label><br>
        <input type="text" id="city" name="city" required><br><br>

                <label for="zip">Zip Code</label><br>
        <input type="text" id="zip" name="zip" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="reason">Reason for Contact</label><br>
        <select id="reason" name="reason" required>
            <option value="">Select one</option>
            <option value="estimate">Request an Estimate</option>
            <option value="project">Project Question</option>
            <option value="support">Support / Warranty</option>
        </select><br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="5" required></textarea><br><br>

        <button type="submit">Send</button>
        <button type="reset">Clear</button>

        

    </form>
</div>
</main>
<footer>
    <p>&copy; 2025 SWW Nonthai. All rights reserved.</p>
</footer>

<script>
    function validateForm() {

        var firstname;
        var lastname;
        var city;
        var zip;
        var email;

        firstname = document.forms[0].firstname.value;
        lastname = document.forms[0].lastname.value;
        city = document.forms[0].city.value;
        zip = document.forms[0].zip.value;
        email = document.forms[0].email.value;

        if (firstname === "" || lastname === "" || city === "") {
            alert("First name, last name, and city are required.");
            return false;
        }

        firstname = firstname.charAt(0).toUpperCase() + firstname.slice(1);
        lastname = lastname.charAt(0).toUpperCase() + lastname.slice(1);
        city = city.charAt(0).toUpperCase() + city.slice(1);

        document.forms[0].firstname.value = firstname;
        document.forms[0].lastname.value = lastname;
        document.forms[0].city.value = city;

        if (zip === "") {
            alert("Zip code is required.");
            return false;
        }

        if (zip.length !== 5) {
            alert("Zip code must be 5 digits.");
            return false;
        }

        if (email === "") {
            alert("Email is required.");
            return false;
        }
        

        if (email.indexOf("@") === -1 || email.indexOf(".") === -1) {
            alert("Email must contain @ and .");
            return false;
        }

        return true;

    }
</script>

</body>
</html>
